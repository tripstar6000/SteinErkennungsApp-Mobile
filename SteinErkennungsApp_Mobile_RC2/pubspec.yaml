name: steinerkennungsapp
description: Offline-first Stein- und Mineral-Erkennungs-App fuer Android und iOS.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: ^0.12.1
  crypto: ^3.0.7
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  geolocator: ^14.0.3
  http: ^1.6.0
  image: ^4.10.1
  image_picker: ^1.2.3
  latlong2: ^0.10.1
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/l10n/
    - assets/ml/

name: mobile-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  analyze-test-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold
        run: flutter create --platforms=android --org de.steinerkennungsapp --project-name steinerkennungsapp .

      - name: Configure Android build compatibility
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/' android/app/build.gradle.kts
          sed -i 's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' android/app/build.gradle.kts
          cat >> android/build.gradle.kts <<'EOF'

          gradle.beforeProject { project ->
              project.plugins.withId("com.android.library") {
                  project.extensions.configure<com.android.build.api.dsl.LibraryExtension> {
                      compileSdk = 37
                      compileOptions {
                          sourceCompatibility = JavaVersion.VERSION_17
                          targetCompatibility = JavaVersion.VERSION_17
                      }
                  }
                  project.afterEvaluate {
                      project.extensions.configure<com.android.build.api.dsl.LibraryExtension> {
                          compileSdk = 37
                          compileOptions {
                              sourceCompatibility = JavaVersion.VERSION_17
                              targetCompatibility = JavaVersion.VERSION_17
                          }
                      }
                      project.tasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {
                          sourceCompatibility = JavaVersion.VERSION_17.toString()
                          targetCompatibility = JavaVersion.VERSION_17.toString()
                      }
                  }
              }
          }

          subprojects {
              tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompilationTask<org.jetbrains.kotlin.gradle.dsl.KotlinJvmCompilerOptions>>().configureEach {
                  compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          EOF

      - name: Remove generated Flutter demo test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format lib test integration_test

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SteinErkennungsApp-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  ios-unsigned:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS scaffold
        run: flutter create --platforms=ios --org de.steinerkennungsapp --project-name steinerkennungsapp .

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --debug --no-codesign




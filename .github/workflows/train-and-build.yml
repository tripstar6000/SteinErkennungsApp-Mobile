name: train-offline-model-and-build

on:
  workflow_dispatch:
    inputs:
      smoke_examples:
        description: "0 = kompletter Datensatz, z. B. 1200 = schneller Testlauf"
        required: false
        default: "1200"

permissions:
  contents: read

jobs:
  train-model:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ML dependencies
        run: pip install -r ml/requirements.txt

      - name: Train offline model
        run: |
          python ml/train_offline_rock_model.py \
            --output-dir assets/ml \
            --max-examples "${{ inputs.smoke_examples }}"

      - name: Upload model bundle
        uses: actions/upload-artifact@v4
        with:
          name: offline-model-bundle
          path: |
            assets/ml/stone_classifier.tflite
            assets/ml/labels.txt
            assets/ml/model_manifest.json
            assets/ml/metrics.json
          retention-days: 30

  build-android:
    needs: train-model
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: offline-model-bundle
          path: assets/ml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold
        run: flutter create --platforms=android --org de.steinerkennungsapp --project-name steinerkennungsapp .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SteinErkennungsApp-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

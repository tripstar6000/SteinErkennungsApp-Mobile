# API

Backend-Basis:
`https://steinerkennungsapp-o1oljh.v2.appdeploy.ai`

Aktuell verwendete Endpunkte:
- `POST /api/identify`
- `POST /api/refine`
- `GET /api/offline/package`
- `GET /api/offline/region`
- `GET /api/library/status`
- `GET /api/calibration/status`
- `POST /api/benchmark/case`

Die Mobile-App nutzt fuer Standard-HTTP keine geheimen Client-Schluessel.

# Architektur

## Schichten

### presentation
`lib/features/*` und `lib/shared/*`

### domain
`lib/domain/*`

### data
`lib/data/local`, `lib/data/remote`, `lib/data/repositories`

### services
Standort, Bildvorbereitung, TFLite-Runtime, physischer Nachtest, Offline-Pakete

## State Management

Riverpod wurde gewaehlt, weil Abhaengigkeiten (DB, API, ML, Standort) testbar
injiziert werden koennen und Flutter-UI nicht direkt an Implementierungen gebunden wird.

## Erkennung

1. 2–3 Bilder aufnehmen/waehlen
2. EXIF-Ausrichtung korrigieren
3. auf max. 1400 px skalieren
4. lokales Modell versuchen
5. bei fehlendem Modell: Remote-API
6. Standortkontext getrennt halten
7. Top-3 darstellen
8. optional physischer Nachtest
9. Ergebnis lokal speichern

# Contributing

Vor jeder groesseren Aenderung:
1. Architektur pruefen
2. kleine isolierte Aenderung
3. `dart format .`
4. `flutter analyze`
5. `flutter test`
6. Android/iOS Build pruefen

Keine Fake-Testergebnisse oder erfundenen Datenquellen committen.

# Lokale Datenbank

SQLite v1:

## scans
- id
- timestamp
- top_candidate
- visual_fit
- image_paths (JSON)
- latitude / longitude (reduziert)
- raw_result (JSON)
- favorite
- note

## packages
- package_id
- version
- checksum
- payload
- installed_at

Naechste Migrationen:
- normalisierte ScanPrediction-Tabelle
- UserCorrection
- Stone-Cache
- ReferenceImage-Cache

